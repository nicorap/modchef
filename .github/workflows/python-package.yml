# Runs the modchef test suite. The runtime layers (cook/search/graph) need only
# rdflib + PyYAML, so they run in a fast "core" job. The indexer/toolchains
# tests need the EasyBuild framework, so they run in a separate "index" job that
# installs the optional [index] extra — keeping the split the codebase relies on.

name: tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  core:
    name: core (runtime, no EasyBuild)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.11", "3.12" ]
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install modchef + dev deps
      run: |
        python -m pip install --upgrade pip
        python -m pip install -e ".[dev]" flake8
    - name: Lint (syntax errors / undefined names)
      run: flake8 src tests --count --select=E9,F63,F7,F82 --show-source --statistics
    - name: Run core tests (exclude EasyBuild-dependent)
      run: pytest --ignore=tests/test_indexer.py --ignore=tests/test_toolchains.py -q

  index:
    name: index (with EasyBuild)
    runs-on: ubuntu-latest
    env:
      # Ubuntu's lmod package ships no 'lmod' on $PATH, so EasyBuild's Lmod
      # detection fails. It also looks at $LMOD_CMD, which is what
      # /etc/profile.d/lmod.sh sets — but that never reaches a non-login
      # `run:` shell, so set it explicitly.
      LMOD_CMD: /usr/share/lmod/lmod/libexec/lmod
    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.11" ]
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install Lmod and dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y lmod lua5.3
    - name: Install modchef + EasyBuild (index extra)
      run: |
        python -m pip install --upgrade pip
        python -m pip install -e ".[index,dev]"
        # resolve_chain() needs real easyconfigs on the robot path to expand a
        # toolchain into its hierarchy; on the HPC the admin user already has
        # them, so they are not an [index] dependency.
        python -m pip install easybuild-easyconfigs
    - name: Run EasyBuild-dependent tests
      run: pytest tests/test_indexer.py tests/test_toolchains.py -q
